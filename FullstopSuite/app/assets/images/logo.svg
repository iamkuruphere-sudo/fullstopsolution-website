<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" width="420" height="84">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.5)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.3)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Aurora Glyph Gradient -->
    <linearGradient id="emblemGlyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="metallicText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Solution Text Gradient -->
    <linearGradient id="solutionText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Fullstop Jewel Radial -->
    <radialGradient id="dotJewel" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON ================= -->
  <g transform="translate(6, 6)">
    <!-- Squircle Shield -->
    <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#emblemBg)" stroke="url(#emblemBorder)" stroke-width="1.5" />
    <rect x="2" y="2" width="68" height="68" rx="18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" />

    <!-- Isometric Monogram FS -->
    <g filter="url(#logoGlow)">
      <!-- Top F arm -->
      <path d="M 20 20 H 52 C 55 20 57 22 57 25 C 57 28 55 30 52 30 H 30 V 36 H 46 C 49 36 51 38 51 41 C 51 44 49 46 46 46 H 30 V 52 C 30 55 28 57 25 57 C 22 57 20 55 20 52 V 25 C 20 22 22 20 25 20 Z" fill="url(#emblemGlyph)" />
    </g>

    <!-- Luminous Fullstop Nucleus Dot -->
    <g filter="url(#dotGlow)">
      <circle cx="51" cy="51" r="7.5" fill="url(#dotJewel)" />
      <circle cx="49" cy="49" r="2" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- ================= WORDMARK TYPOGRAPHY ================= -->
  <g transform="translate(94, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="0.01em">
      <tspan fill="url(#metallicText)">FULLSTOP</tspan>
      <tspan dx="8" fill="url(#solutionText)" font-weight="700">SOLUTION</tspan>
    </text>

    <!-- Radiant Fullstop Dot -->
    <circle cx="282" cy="38" r="4.5" fill="url(#dotJewel)" filter="url(#dotGlow)" />

    <!-- Subtitle / Domain Label -->
    <text x="1" y="64" font-family="'Plus Jakarta Sans', ui-monospace, Menlo, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.14em">
      ENTERPRISE DIGITAL PLATFORM
    </text>
  </g>
</svg>
