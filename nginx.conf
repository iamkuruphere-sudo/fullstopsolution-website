# Nginx configuration for www.fullstopsolution.in
server {
    listen 80;
    listen [::]:80;
    server_name fullstopsolution.in www.fullstopsolution.in;
    return 301 https://www.fullstopsolution.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fullstopsolution.in;

    root /var/www/fullstopsolution-website;
    index index.html;

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/fullstopsolution.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/fullstopsolution.in/privkey.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://www.paypal.com https://www.paypalobjects.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://www.paypal.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
