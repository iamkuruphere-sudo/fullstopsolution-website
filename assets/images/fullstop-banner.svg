<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Specular Border Gradient -->
    <linearGradient id="banner-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emblem Shield Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Specular Emblem Border -->
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)" />
    </linearGradient>

    <!-- Aurora Glyph Gradient -->
    <linearGradient id="auroraGlyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#60a5fa" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wordmark Solution Gradient -->
    <linearGradient id="solutionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="metallicText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Fullstop Jewel Radial -->
    <radialGradient id="dotJewel" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dotGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Outer Card -->
  <rect x="2" y="2" width="956" height="236" rx="24" fill="url(#banner-bg)" stroke="url(#banner-border)" stroke-width="2" />

  <!-- Subtle Ambient Circuit & Grid Accents -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="2" y="2" width="956" height="236" rx="24" />
    </clipPath>
    <line x1="230" y1="2" x2="230" y2="238" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
    <circle cx="125" cy="120" r="105" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- ================= LEFT: ICONIC 3D "FS" EMBLEM ================= -->
  <g transform="translate(42, 36)">
    <!-- Squircle Badge Base -->
    <rect x="0" y="0" width="168" height="168" rx="42" fill="url(#emblemBg)" stroke="url(#emblemBorder)" stroke-width="2" filter="url(#neonGlow)" />
    <rect x="3" y="3" width="162" height="162" rx="39" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

    <!-- FS Monogram Paths -->
    <g transform="translate(18, 18)">
      <!-- F Bar Geometry -->
      <path d="M 28 20 H 104 C 110 20 114 24 114 30 C 114 36 110 40 104 40 H 48 V 52 H 88 C 94 52 98 56 98 62 C 98 68 94 72 88 72 H 48 V 104 C 48 110 44 114 38 114 C 32 114 28 110 28 104 V 30 C 28 24 32 20 38 20 Z" fill="url(#auroraGlyph)" />

      <!-- S Flow Ribbon -->
      <path d="M 72 52 C 72 44 78 38 86 38 H 94 C 98 38 102 34 102 30 C 102 26 98 22 94 22 H 68 C 62 22 58 18 58 12 C 58 6 62 2 68 2 H 98 C 110 2 120 12 120 24 C 120 34 112 44 100 48 L 88 52 C 78 56 72 64 72 74 C 72 86 82 96 94 96 H 98 C 104 96 108 100 108 106 C 108 112 104 116 98 116 H 90 C 76 116 64 104 64 90 C 64 78 74 68 86 64 L 98 60" fill="none" stroke="url(#auroraGlyph)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    </g>

    <!-- Luminous Fullstop Nucleus Dot -->
    <g filter="url(#dotGlow)">
      <circle cx="124" cy="122" r="14" fill="url(#dotJewel)" />
      <circle cx="120" cy="118" r="4.5" fill="#ffffff" opacity="0.95" />
    </g>
  </g>

  <!-- ================= RIGHT: WORDMARK & BRAND SYSTEM ================= -->
  <g transform="translate(254, 42)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="232" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#22d3ee" />
      <text x="28" y="17" fill="#38bdf8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">
        ENTERPRISE DIGITAL PLATFORM
      </text>
    </g>

    <!-- Primary Typography Wordmark -->
    <text x="0" y="74" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.015em">
      <tspan fill="url(#metallicText)">FULLSTOP </tspan><tspan fill="url(#solutionGradient)">SOLUTION</tspan>
    </text>

    <!-- Radiant Cyan Dot -->
    <circle cx="510" cy="62" r="7.5" fill="url(#dotJewel)" filter="url(#dotGlow)" />

    <!-- Subtitle & Domain Row -->
    <text x="2" y="106" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14.5" font-weight="600" fill="#94a3b8">
      <tspan fill="#38bdf8" font-weight="700">www.fullstopsolution.in</tspan>
      <tspan fill="#64748b"> • </tspan>
      <tspan fill="#cbd5e1">Precision Tools, Security Workstations &amp; Zero-Knowledge Systems</tspan>
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 126)">
      <!-- Badge 1: 100% In-Browser Privacy -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="24" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="84" y="16" fill="#34d399" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🔒 100% Client-Side</text>
      </g>

      <!-- Badge 2: Zero Telemetry -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="154" height="24" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
        <text x="77" y="16" fill="#38bdf8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">⚡ Zero Telemetry</text>
      </g>

      <!-- Badge 3: Cross Platform -->
      <g transform="translate(342, 0)">
        <rect x="0" y="0" width="186" height="24" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="93" y="16" fill="#e2e8f0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🍏 Mac • 🪟 Win • 🐧 Linux</text>
      </g>

      <!-- Badge 4: Verified Builds -->
      <g transform="translate(538, 0)">
        <rect x="0" y="0" width="128" height="24" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
        <text x="64" y="16" fill="#c084fc" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ SHA-256 Verified</text>
      </g>
    </g>
  </g>
</svg>
